appId: studio.atelier.app
productName: Sift
directories:
  output: release
files:
  - out/**
  - package.json
# ExifTool is a separate executable and cannot run from inside the asar archive.
asarUnpack:
  - node_modules/exiftool-vendored.exe/**
  - node_modules/exiftool-vendored.pl/**
win:
  target: nsis
  artifactName: Sift-Setup-${version}.${ext}
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # What the app has learned lives in %APPDATA%\Sift and survives updates and uninstalls alike.
  # The installer replaces the version called Atelier (same appId), keeping its data.
  deleteAppDataOnUninstall: false
linux:
  target: dir
