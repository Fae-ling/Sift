appId: studio.atelier.app
productName: Atelier
directories:
  output: release
files:
  - out/**
  - package.json
# ExifTool is a separate executable and cannot run from inside the asar archive.
asarUnpack:
  - node_modules/exiftool-vendored.exe/**
  - node_modules/exiftool-vendored.pl/**
win:
  target: nsis
  artifactName: Atelier-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # What the app has learned lives in %APPDATA%\Atelier and survives updates and uninstalls alike.
  deleteAppDataOnUninstall: false
linux:
  target: dir
