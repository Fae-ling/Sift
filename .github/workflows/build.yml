name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows-installer:
    needs: test
    runs-on: windows-latest
    permissions:
      # To publish the installer as a release, which the app's updater looks for.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every build gets its own version, so the app can tell that a newer one exists.
      - run: npm version "0.2.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Atelier-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.2.${{ github.run_number }}" release/*.exe \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Atelier 0.2.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%B)"
